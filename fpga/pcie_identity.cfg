# PCIe identity of the board as a card (one source for the XDMA IP settings, the card_regs identity words and the host-side check).
# `key value` per line, hex without 0x. Read by fpga/scripts/pcie/xdma_ip.tcl, fpga/scripts/build_soc.tcl and tools/pcie_identity.py.
# The IDs live in the PCIe hard block's configuration space and ship inside the configuration bitstream: a flash boot enumerates with exactly the
# values of the bitstream that is in the flash (the edge connector has no EEPROM or SMBus to read them from).
vendor_id 10EE
device_id 9034
subsystem_vendor_id 10EE
subsystem_id 0007
# 05 80 00 = memory controller, other. The IP default 07 00 01 (16450 serial controller) can make a host bind a serial driver.
class_code 058000
revision_id 00
